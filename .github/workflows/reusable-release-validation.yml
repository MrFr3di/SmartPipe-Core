name: Reusable release validation

on:
  workflow_call:
    inputs:
      package-version:
        description: Optional package version override (for a release tag)
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name of the validated package artifact
        required: false
        type: string
        default: packages
      validation-mode:
        description: Package validation mode (current or release)
        required: false
        type: string
        default: current
      package-artifact-id:
        description: Existing immutable artifact ID to validate without repacking
        required: false
        type: string
        default: ''
      runner-labels:
        description: Runner labels as a JSON array
        required: false
        type: string
        default: '["ubuntu-latest"]'

    outputs:
      artifact-id:
        description: Immutable package artifact ID
        value: ${{ jobs.build-test-pack.outputs.artifact-id }}
      package-version:
        description: Exact validated package version
        value: ${{ jobs.build-test-pack.outputs.package-version }}

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  VALIDATION_MODE: ${{ inputs.validation-mode }}
  PACKAGE_ARTIFACT_ID: ${{ inputs.package-artifact-id }}

jobs:
  build-test-pack:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner-labels) }}

    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
      package-version: ${{ steps.version.outputs.package-version }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Validate package workflow inputs
      shell: pwsh
      run: |
        if ($env:VALIDATION_MODE -notin @('current', 'release')) { throw 'Invalid validation mode.' }
        if ($env:PACKAGE_ARTIFACT_ID -ne '' -and $env:PACKAGE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') { throw 'Invalid package artifact ID.' }

    - name: Restore locked
      run: dotnet restore SmartPipe.Core.slnx --locked-mode -p:DisableImplicitLibraryPacksFolder=true

    - name: Test release version validation
      shell: pwsh
      run: |
        if ($IsWindows) {
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          if (!(Test-Path -LiteralPath $bash -PathType Leaf)) { throw "Git Bash is required at $bash." }
          & $bash -lc 'eng/tests/validate-release-version.Tests.sh'
        }
        else {
          bash eng/tests/validate-release-version.Tests.sh
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install workflow contract parser
      run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.16

    - name: Test workflow contracts
      shell: pwsh
      run: ./eng/tests/workflow-contract.Tests.ps1

    - name: Test package artifact validation
      shell: pwsh
      run: ./eng/tests/validate-package-artifact.Tests.ps1

    - name: Format verify
      run: dotnet format SmartPipe.Core.slnx --verify-no-changes --no-restore

    - name: Build
      run: dotnet build SmartPipe.Core.slnx --no-restore -c Release -warnaserror

    - name: Verify RepositoryChecks profile
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify --profile sp220-05 --format github --failures-only

    - name: Repository baseline contract tests
      run: dotnet test --project tests/SmartPipe.RepositoryChecks.Tests/SmartPipe.RepositoryChecks.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Set package version
      id: version
      shell: pwsh
      env:
        REQUESTED_PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        $packageVersion = $env:REQUESTED_PACKAGE_VERSION
        if ([string]::IsNullOrWhiteSpace($packageVersion)) {
          $packageVersion = dotnet msbuild src/SmartPipe.Core/SmartPipe.Core.csproj -getProperty:Version -nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        "package-version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Record build commit
      run: git rev-parse HEAD

    - name: Set package directory
      shell: pwsh
      run: |
        $packageDirectory = if ($env:PACKAGE_ARTIFACT_ID -eq '') { 'artifacts/packages' } else { 'downloaded/artifacts/packages' }
        "PACKAGE_DIRECTORY=$packageDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Download producer package artifact
      if: inputs.package-artifact-id != ''
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        artifact-ids: ${{ inputs.package-artifact-id }}
        path: downloaded
        merge-multiple: true

    - name: Validate producer package artifact
      if: inputs.package-artifact-id != ''
      shell: pwsh
      run: ./eng/validate-package-artifact.ps1 -ArtifactRoot downloaded -ExpectedVersion "$env:PACKAGE_VERSION" -GraphPath eng/package-graph.json -ExpectedMode "$env:VALIDATION_MODE" -ExpectedCommit (git rev-parse HEAD)

    - name: Pack packages from graph
      if: inputs.package-artifact-id == ''
      shell: pwsh
      run: >
        dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj
        --configuration Release --no-build -- pack-packages
        --mode "$env:VALIDATION_MODE" --configuration Release --package-version "$env:PACKAGE_VERSION"
        --output artifacts/packages --manifest artifacts/packages/manifest.json

    - name: Provision 2.1.2 baseline packages
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- provision-baseline --repo-root . --manifest eng/baselines/2.1.2/manifest.json --packages-dir artifacts/baselines/2.1.2

    - name: Verify 2.1.2 baseline offline
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-baseline --repo-root . --manifest eng/baselines/2.1.2/manifest.json --packages-dir artifacts/baselines/2.1.2 --offline --mode integrity

    - name: Verify package graph current
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-graph --mode current --packages "$env:PACKAGE_DIRECTORY"

    - name: Verify package metadata current
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-metadata --package-directory "$env:PACKAGE_DIRECTORY" --mode current --report artifacts/packages/metadata-report.json

    - name: Verify package ownership current
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-ownership --baseline eng/baselines/2.1.2 --packages "$env:PACKAGE_DIRECTORY" --mode current

    - name: Verify release versions current
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-release-version --tag "v$env:PACKAGE_VERSION" --package-directory "$env:PACKAGE_DIRECTORY" --mode current

    - name: Verify package graph release
      if: inputs.validation-mode == 'release'
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-graph --mode release --packages "$env:PACKAGE_DIRECTORY"

    - name: Verify package metadata release
      if: inputs.validation-mode == 'release'
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-metadata --mode release --packages "$env:PACKAGE_DIRECTORY" --report artifacts/release-metadata-report.json

    - name: Verify package ownership release
      if: inputs.validation-mode == 'release'
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-package-ownership --mode release --baseline eng/baselines/2.1.2 --packages "$env:PACKAGE_DIRECTORY"

    - name: Verify release versions release
      if: inputs.validation-mode == 'release'
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-release-version --mode release --tag "v$env:PACKAGE_VERSION" --package-directory "$env:PACKAGE_DIRECTORY"

    - name: Run current consumers
      shell: pwsh
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- run-consumers --set current --exclude-category postgresql --package-directory "$env:PACKAGE_DIRECTORY" --package-version "$env:PACKAGE_VERSION"

    - name: Core correctness regressions
      run: dotnet test --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release --filter-query /[Category=CorrectnessRegression] --minimum-expected-tests 1

    - name: Core concurrency regressions
      run: dotnet test --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release --filter-query /[Category=ConcurrencyRegression] --minimum-expected-tests 1

    - name: Extensions correctness regressions
      shell: pwsh
      run: |
        dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.HealthCheckTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.ChannelMergeTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Json.Tests/SmartPipe.Extensions.Json.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.DeadLetterSinkTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.Sinks.DbSinkTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.Selectors.DapperSelectorTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Json.Tests/SmartPipe.Extensions.Json.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.Sinks.JsonFileSinkTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test --project tests/SmartPipe.Extensions.Http.Tests/SmartPipe.Extensions.Http.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Http.Tests.HttpPipelineComponentsTests --minimum-expected-tests 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: PR concurrency regression repeat
      if: github.event_name == 'pull_request'
      shell: pwsh
      run: |
        foreach ($pass in 1..10) {
          Write-Output "Concurrency regression pass $pass"
          dotnet test --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release --filter-query /[Category=ConcurrencyRegression] --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.ChannelMergeTests --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SmartPipe.Extensions.Channels.Tests/SmartPipe.Extensions.Channels.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Channels.Tests.ChannelMergeContractTests --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/SmartPipe.Extensions.Json.Tests/SmartPipe.Extensions.Json.Tests.csproj --no-build -c Release --filter-class SmartPipe.Extensions.Tests.Sinks.JsonFileSinkTests --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Core tests with coverage
      timeout-minutes: 15
      run: dotnet run --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release -- --filter-not-trait Category=Stress --timeout 15m --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    - name: Core stress tests
      timeout-minutes: 15
      run: dotnet run --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release -- --filter-trait Category=Stress --timeout 15m

    - name: Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build --verbosity normal -c Release

    - name: CSV Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Csv.Tests/SmartPipe.Extensions.Csv.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Dapper Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Dapper.Tests/SmartPipe.Extensions.Dapper.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: EntityFrameworkCore Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.EntityFrameworkCore.Tests/SmartPipe.Extensions.EntityFrameworkCore.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Mapster Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Mapster.Tests/SmartPipe.Extensions.Mapster.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: HTTP Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Http.Tests/SmartPipe.Extensions.Http.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: HTTP JSON Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Http.Json.Tests/SmartPipe.Extensions.Http.Json.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Polly Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Polly.Tests/SmartPipe.Extensions.Polly.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Testing helper tests
      run: dotnet test --project tests/SmartPipe.Testing.Tests/SmartPipe.Testing.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: SP220-07 leaf tests
      shell: pwsh
      run: |
        $projects = @(
          'tests/SmartPipe.Extensions.Channels.Tests/SmartPipe.Extensions.Channels.Tests.csproj'
          'tests/SmartPipe.Extensions.Transforms.Tests/SmartPipe.Extensions.Transforms.Tests.csproj'
          'tests/SmartPipe.Extensions.Logging.Tests/SmartPipe.Extensions.Logging.Tests.csproj'
          'tests/SmartPipe.Extensions.DataAnnotations.Tests/SmartPipe.Extensions.DataAnnotations.Tests.csproj'
        )
        foreach ($project in $projects) {
          dotnet test --project $project --no-build --configuration Release --minimum-expected-tests 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Dependency Injection tests
      run: dotnet test --project tests/SmartPipe.Extensions.DependencyInjection.Tests/SmartPipe.Extensions.DependencyInjection.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: HealthChecks tests
      run: dotnet test --project tests/SmartPipe.Extensions.HealthChecks.Tests/SmartPipe.Extensions.HealthChecks.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: Hosting lifecycle regressions
      run: dotnet test --project tests/SmartPipe.Extensions.Hosting.Tests/SmartPipe.Extensions.Hosting.Tests.csproj --configuration Release --no-build --filter-query /[Category=HostingLifecycle] --minimum-expected-tests 1

    - name: Hosting tests
      run: dotnet test --project tests/SmartPipe.Extensions.Hosting.Tests/SmartPipe.Extensions.Hosting.Tests.csproj --configuration Release --no-build --minimum-expected-tests 1

    - name: JSON Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Json.Tests/SmartPipe.Extensions.Json.Tests.csproj --no-build --verbosity normal -c Release

    - name: Test and benchmark warning gate
      shell: pwsh
      run: |
        dotnet build tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/SmartPipe.Extensions.Json.Tests/SmartPipe.Extensions.Json.Tests.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/SmartPipe.Extensions.Hosting.Tests/SmartPipe.Extensions.Hosting.Tests.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/SmartPipe.Extensions.HealthChecks.Tests/SmartPipe.Extensions.HealthChecks.Tests.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build benchmarks/SmartPipe.Benchmarks/SmartPipe.Benchmarks.csproj --no-restore -c Release -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Vulnerable package scan
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path artifacts/audit -Force | Out-Null
        dotnet package list --project SmartPipe.Core.slnx --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/audit/vulnerable.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify direct production audit policy
      run: dotnet run --project eng/SmartPipe.RepositoryChecks/SmartPipe.RepositoryChecks.csproj --configuration Release --no-build -- verify-nuget-audit --repo-root . --report artifacts/audit/vulnerable.json

    - name: Deprecated package scan
      shell: pwsh
      run: dotnet package list --project SmartPipe.Core.slnx --deprecated --include-transitive --format json --output-version 1 --no-restore > artifacts/audit/deprecated.json

    - name: Outdated package report
      shell: pwsh
      continue-on-error: true
      run: dotnet package list --project SmartPipe.Core.slnx --outdated --format json --output-version 1 --no-restore > artifacts/audit/outdated.json

    - name: Docs link check
      if: runner.os != 'Windows'
      uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
      with:
        args: --no-progress README.md 'docs/**/*.md'

    - name: Docs link check (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $lychee = Join-Path $env:RUNNER_TEMP 'lychee-v0.21.0.exe'
        $exitCode = 0
        try {
          Invoke-WebRequest -Uri 'https://github.com/lycheeverse/lychee/releases/download/lychee-v0.21.0/lychee-x86_64-windows.exe' -OutFile $lychee
          $actualHash = (Get-FileHash -LiteralPath $lychee -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'a1784c32c63ba46dccef0698ddf6be82a83a7d0455b0fd772423d601e3c70ab4'
          if ($actualHash -ne $expectedHash) { throw "Lychee SHA256 mismatch: $actualHash" }
          & $lychee --no-progress README.md 'docs/**/*.md'
          $exitCode = $LASTEXITCODE
        }
        finally {
          Remove-Item -LiteralPath $lychee -Force -ErrorAction SilentlyContinue
        }
        if ($exitCode -ne 0) { exit $exitCode }

    - name: Upload immutable packages and reports
      id: packages
      if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.package-artifact-id == ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        retention-days: ${{ github.event_name == 'pull_request' && 1 || inputs.artifact-name == 'packages' && 7 || 90 }}
        path: |
          artifacts/packages
          artifacts/consumers/**/result.json
          artifacts/audit
          artifacts/release-metadata-report.json
          eng/package-graph.json
        if-no-files-found: error

    - name: Upload replay reports
      if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.package-artifact-id != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        retention-days: 90
        path: |
          artifacts/consumers/**/result.json
          artifacts/audit
          artifacts/release-metadata-report.json
        if-no-files-found: error

  health-checks-concurrency:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner-labels) }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore locked
      run: dotnet restore SmartPipe.Core.slnx --locked-mode -p:DisableImplicitLibraryPacksFolder=true

    - name: Build concurrency projects
      shell: pwsh
      run: |
        dotnet build tests/SmartPipe.Extensions.DependencyInjection.Tests/SmartPipe.Extensions.DependencyInjection.Tests.csproj --configuration Release --no-restore -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet build tests/SmartPipe.Extensions.HealthChecks.Tests/SmartPipe.Extensions.HealthChecks.Tests.csproj --configuration Release --no-restore -warnaserror
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run bounded observation concurrency
      run: dotnet test --project tests/SmartPipe.Extensions.DependencyInjection.Tests/SmartPipe.Extensions.DependencyInjection.Tests.csproj --configuration Release --no-build --filter-method SmartPipe.Extensions.DependencyInjection.Tests.RunObservationStoreTests.ConcurrentTerminalCommitsAcrossKeysRemainBoundedAndStrictlySequenced --minimum-expected-tests 1

    - name: Run concurrent health evaluation
      run: dotnet test --project tests/SmartPipe.Extensions.HealthChecks.Tests/SmartPipe.Extensions.HealthChecks.Tests.csproj --configuration Release --no-build --filter-method SmartPipe.Extensions.HealthChecks.Tests.HealthChecksContractTests.ConcurrentHealthChecksRemainDeterministic --minimum-expected-tests 1
