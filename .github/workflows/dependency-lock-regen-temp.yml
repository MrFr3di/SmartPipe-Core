name: Dependency lock regeneration (temporary)
on:
  push:
    branches:
      - maintenance/2.2.1-grouped-otel-coverage-ci-diagnostics

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'MrFr3di/SmartPipe-Core'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Recalculate NuGet locks using NuGet, not hand-edited hashes
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore SmartPipe.Core.slnx --force-evaluate -p:RestoreLockedMode=false -p:DisableImplicitLibraryPacksFolder=true
          dotnet restore tests/Consumers/Scenarios/csv-facade-source/Consumer.csproj --force-evaluate -p:RestoreLockedMode=false -p:DisableImplicitLibraryPacksFolder=true
          git diff --name-only
          if git diff --name-only | grep -Ev '(^|/)packages\.lock\.json$'; then
            echo 'Unexpected non-lockfile changes from restore' >&2
            exit 1
          fi
          git add -u -- ':(glob)**/packages.lock.json'
          if git diff --cached --quiet; then
            echo 'No lockfile delta'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(deps): regenerate NuGet lockfiles for grouped updates'
          git push origin HEAD:refs/heads/maintenance/2.2.1-grouped-otel-coverage-ci-diagnostics
