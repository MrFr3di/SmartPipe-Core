name: Performance lab

on:
  push:
    branches: [ perf/2.2.0-comparative-lab ]
    paths:
      - '.github/workflows/perf-lab.yml'
      - 'benchmarks/SmartPipe.Benchmarks/**'
      - 'docs/performance/**'
      - 'eng/perf/**'
      - 'eng/tests/perf-*.Tests.ps1'
      - 'perf/**'
      - 'global.json'
      - 'Directory.Packages.props'
      - '**/packages.lock.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Lab validation mode
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - benchmark-smoke
          - bench
          - materialize
          - stress
          - di-smoke
          - di-bench
          - hosting-smoke
          - hosting-bench
          - health-smoke
          - health-bench
          - otel-smoke
          - otel-bench
          - extensions-smoke
          - extensions-bench
          - json-smoke
          - json-bench
          - csv-smoke
          - csv-bench
          - dapper-smoke
          - dapper-bench
          - ef-smoke
          - ef-bench
          - soak
      candidate-sha:
        description: Exact candidate SHA override; must match the pinned SP220-01-11 target
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: perf-lab-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && (contains(github.event.head_commit.message, '[perf-ab-smoke]') || contains(github.event.head_commit.message, '[perf-materialize]') || contains(github.event.head_commit.message, '[perf-bench]') || contains(github.event.head_commit.message, '[perf-stress]') || contains(github.event.head_commit.message, '[perf-di-smoke]') || contains(github.event.head_commit.message, '[perf-di-bench]') || contains(github.event.head_commit.message, '[perf-hosting-smoke]') || contains(github.event.head_commit.message, '[perf-hosting-bench]') || contains(github.event.head_commit.message, '[perf-health-smoke]') || contains(github.event.head_commit.message, '[perf-health-bench]') || (contains(github.event.head_commit.message, '[perf-otel-smoke]') || contains(github.event.head_commit.message, '[perf-otel-bench]')) || contains(github.event.head_commit.message, '[perf-extensions-smoke]') || contains(github.event.head_commit.message, '[perf-extensions-bench]') || contains(github.event.head_commit.message, '[perf-json-smoke]') || contains(github.event.head_commit.message, '[perf-json-bench]') || contains(github.event.head_commit.message, '[perf-csv-smoke]') || contains(github.event.head_commit.message, '[perf-csv-bench]') || contains(github.event.head_commit.message, '[perf-dapper-smoke]') || contains(github.event.head_commit.message, '[perf-dapper-bench]') || contains(github.event.head_commit.message, '[perf-ef-smoke]') || contains(github.event.head_commit.message, '[perf-ef-bench]')) && 'explicit') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'smoke' && 'explicit') || 'smoke' }}
  cancel-in-progress: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[perf-ab-smoke]') && !contains(github.event.head_commit.message, '[perf-materialize]') && !contains(github.event.head_commit.message, '[perf-bench]') && !contains(github.event.head_commit.message, '[perf-stress]') && !contains(github.event.head_commit.message, '[perf-di-smoke]') && !contains(github.event.head_commit.message, '[perf-di-bench]') && !contains(github.event.head_commit.message, '[perf-hosting-smoke]') && !contains(github.event.head_commit.message, '[perf-hosting-bench]') && !contains(github.event.head_commit.message, '[perf-health-smoke]') && !contains(github.event.head_commit.message, '[perf-health-bench]') && !(contains(github.event.head_commit.message, '[perf-otel-smoke]') || contains(github.event.head_commit.message, '[perf-otel-bench]')) && !contains(github.event.head_commit.message, '[perf-extensions-smoke]') && !contains(github.event.head_commit.message, '[perf-extensions-bench]') && !contains(github.event.head_commit.message, '[perf-json-smoke]') && !contains(github.event.head_commit.message, '[perf-json-bench]') && !contains(github.event.head_commit.message, '[perf-csv-smoke]') && !contains(github.event.head_commit.message, '[perf-csv-bench]') && !contains(github.event.head_commit.message, '[perf-dapper-smoke]') && !contains(github.event.head_commit.message, '[perf-dapper-bench]') && !contains(github.event.head_commit.message, '[perf-ef-smoke]') && !contains(github.event.head_commit.message, '[perf-ef-bench]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PERF_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'smoke' }}
  PERF_CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate-sha || '' }}

jobs:
  smoke:
    name: Perf lab contract and benchmark smoke
    if: ${{ github.event_name == 'push' || inputs.mode == 'smoke' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate performance-lab contracts
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode "$env:PERF_MODE" -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Test performance-lab contracts
        shell: pwsh
        run: ./eng/tests/perf-lab-contract.Tests.ps1

      - name: Test performance-lab scripts
        shell: pwsh
        run: ./eng/tests/perf-scripts.Tests.ps1

      - name: Test performance reporting
        shell: pwsh
        run: |
          ./eng/tests/perf-report.Tests.ps1
          ./eng/tests/perf-di-report.Tests.ps1
          ./eng/tests/perf-hosting-report.Tests.ps1
          ./eng/tests/perf-healthchecks-report.Tests.ps1
          ./eng/tests/perf-opentelemetry-report.Tests.ps1
          ./eng/tests/perf-extensions-report.Tests.ps1
          ./eng/tests/perf-json-report.Tests.ps1
          ./eng/tests/perf-csv-report.Tests.ps1
          ./eng/tests/perf-dapper-report.Tests.ps1
          ./eng/tests/perf-entity-framework-core-report.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore benchmark project
        run: dotnet restore benchmarks/SmartPipe.Benchmarks/SmartPipe.Benchmarks.csproj --locked-mode -p:DisableImplicitLibraryPacksFolder=true

      - name: Build benchmark project
        run: dotnet build benchmarks/SmartPipe.Benchmarks/SmartPipe.Benchmarks.csproj --configuration Release --no-restore -warnaserror

      - name: BenchmarkDotNet dry smoke
        run: >
          dotnet run --project benchmarks/SmartPipe.Benchmarks/SmartPipe.Benchmarks.csproj
          --configuration Release --no-build --
          --job Dry
          --filter '*PipelineDefinitionBenchmarks*'
          --artifacts artifacts/perf/benchmark-smoke

  heavy-mode-contract:
    name: Validate requested heavy mode
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'soak' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate target pinning
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode "$env:PERF_MODE" -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Stop until deterministic runners exist
        shell: pwsh
        run: |
          Write-Error "Soak mode is reserved by the lab contract but its deterministic runner is not implemented yet. Do not substitute ad-hoc timing."


  materialize:
    name: Materialize immutable A/B targets
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'materialize' || inputs.mode == 'benchmark-smoke' || inputs.mode == 'bench')) || (github.event_name == 'push' && ((contains(github.event.head_commit.message, '[perf-materialize]') || contains(github.event.head_commit.message, '[perf-bench]')) || contains(github.event.head_commit.message, '[perf-ab-smoke]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Materialize baseline and candidate
        shell: pwsh
        run: |
          $candidate = "$env:PERF_CANDIDATE_SHA"
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = '61ceef6bf69aef0a4f79b25384352d238979200f'
          }
          $mode = '${{ inputs.mode }}'
          $message = '${{ github.event.head_commit.message }}'
          if ($mode -eq 'benchmark-smoke' -or $message.Contains('[perf-ab-smoke]')) {
            ./eng/perf/prepare-core-ab.ps1 -CandidateSha $candidate -RunDry
          }
          elseif ($mode -eq 'bench' -or $message.Contains('[perf-bench]')) {
            ./eng/perf/run-core-ab.ps1 -CandidateSha $candidate -Job Short
          }
          else {
            ./eng/perf/prepare-target.ps1 -Target all -CandidateSha $candidate
          }

      - name: Upload target provenance and smoke evidence
        if: ${{ always() && inputs.mode != 'bench' && !contains(github.event.head_commit.message, '[perf-bench]') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-target-provenance-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/packages/manifest.json
            artifacts/perf/targets/**/metadata-report.json
            artifacts/perf/core-ab/**/build-provenance.json
            artifacts/perf/core-ab/**/packages.lock.json
            artifacts/perf/core-ab/**/BenchmarkDotNet.Artifacts/**
            artifacts/perf/core-ab/dotnet-info.txt
            artifacts/perf/targets/**/diagnostics/**
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload comparative benchmark evidence
        if: ${{ always() && (inputs.mode == 'bench' || contains(github.event.head_commit.message, '[perf-bench]')) }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-core-ab-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/core-ab/**/build-provenance.json
            artifacts/perf/core-ab/**/packages.lock.json
            artifacts/perf/runs/core-ab/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 9


  stress:
    name: Deterministic Core A/B stress
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'stress') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[perf-stress]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate target pinning
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode stress -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Test performance-lab scripts
        shell: pwsh
        run: ./eng/tests/perf-scripts.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run deterministic stress
        shell: pwsh
        run: |
          $candidate = "$env:PERF_CANDIDATE_SHA"
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = '61ceef6bf69aef0a4f79b25384352d238979200f'
          }
          ./eng/perf/run-core-stress.ps1 -CandidateSha $candidate -ItemsPerRun 1000

      - name: Upload stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-core-stress-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/core-ab/**/build-provenance.json
            artifacts/perf/core-stress/**
            artifacts/perf/runs/core-stress/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9


  di-evolution:
    name: DI evolution lab
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'di-smoke' || inputs.mode == 'di-bench')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[perf-di-smoke]') || contains(github.event.head_commit.message, '[perf-di-bench]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate lab contracts
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode smoke -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Test performance-lab scripts
        shell: pwsh
        run: ./eng/tests/perf-scripts.Tests.ps1

      - name: Test DI reporting
        shell: pwsh
        run: ./eng/tests/perf-di-report.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run DI evolution mode
        shell: pwsh
        run: |
          $candidate = "$env:PERF_CANDIDATE_SHA"
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = '61ceef6bf69aef0a4f79b25384352d238979200f'
          }
          $mode = '${{ inputs.mode }}'
          $message = '${{ github.event.head_commit.message }}'
          if ($mode -eq 'di-bench' -or $message.Contains('[perf-di-bench]')) {
            ./eng/perf/run-di-evolution.ps1 -CandidateSha $candidate -Job Short
          }
          else {
            ./eng/perf/prepare-di-evolution.ps1 -CandidateSha $candidate -RunDry
          }

      - name: Upload DI smoke evidence
        if: ${{ always() && inputs.mode != 'di-bench' && !contains(github.event.head_commit.message, '[perf-di-bench]') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-di-evolution-smoke-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/dependency-injection/**/build-provenance.json
            artifacts/perf/dependency-injection/**/packages.lock.json
            artifacts/perf/dependency-injection/**/BenchmarkDotNet.Artifacts/**
            artifacts/perf/dependency-injection/dotnet-info.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload DI benchmark evidence
        if: ${{ always() && (inputs.mode == 'di-bench' || contains(github.event.head_commit.message, '[perf-di-bench]')) }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-di-evolution-bench-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/dependency-injection/**/build-provenance.json
            artifacts/perf/dependency-injection/**/packages.lock.json
            artifacts/perf/runs/dependency-injection/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9


  hosting-evolution:
    name: Hosting evolution lab
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'hosting-smoke' || inputs.mode == 'hosting-bench')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[perf-hosting-smoke]') || contains(github.event.head_commit.message, '[perf-hosting-bench]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate lab contracts
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode smoke -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Test performance-lab scripts
        shell: pwsh
        run: ./eng/tests/perf-scripts.Tests.ps1

      - name: Test Hosting reporting
        shell: pwsh
        run: ./eng/tests/perf-hosting-report.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run Hosting evolution mode
        shell: pwsh
        run: |
          $candidate = "$env:PERF_CANDIDATE_SHA"
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = '61ceef6bf69aef0a4f79b25384352d238979200f'
          }
          $mode = '${{ inputs.mode }}'
          $message = '${{ github.event.head_commit.message }}'
          if ($mode -eq 'hosting-bench' -or $message.Contains('[perf-hosting-bench]')) {
            ./eng/perf/run-hosting-evolution.ps1 -CandidateSha $candidate -Job Short
          }
          else {
            ./eng/perf/prepare-hosting-evolution.ps1 -CandidateSha $candidate -RunDry
          }

      - name: Upload Hosting smoke evidence
        if: ${{ always() && inputs.mode != 'hosting-bench' && !contains(github.event.head_commit.message, '[perf-hosting-bench]') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-hosting-evolution-smoke-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/hosting/**/build-provenance.json
            artifacts/perf/hosting/**/packages.lock.json
            artifacts/perf/hosting/**/BenchmarkDotNet.Artifacts/**
            artifacts/perf/hosting/dotnet-info.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload Hosting benchmark evidence
        if: ${{ always() && (inputs.mode == 'hosting-bench' || contains(github.event.head_commit.message, '[perf-hosting-bench]')) }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-hosting-evolution-bench-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/hosting/**/build-provenance.json
            artifacts/perf/hosting/**/packages.lock.json
            artifacts/perf/runs/hosting/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9


  healthchecks-evolution:
    name: HealthChecks evolution lab
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'health-smoke' || inputs.mode == 'health-bench')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[perf-health-smoke]') || contains(github.event.head_commit.message, '[perf-health-bench]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate lab contracts
        shell: pwsh
        run: ./eng/perf/validate-perf-lab.ps1 -Mode smoke -CandidateSha "$env:PERF_CANDIDATE_SHA"

      - name: Test performance-lab scripts
        shell: pwsh
        run: ./eng/tests/perf-scripts.Tests.ps1

      - name: Test HealthChecks reporting
        shell: pwsh
        run: ./eng/tests/perf-healthchecks-report.Tests.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Run HealthChecks evolution mode
        shell: pwsh
        run: |
          $candidate = "$env:PERF_CANDIDATE_SHA"
          if ([string]::IsNullOrWhiteSpace($candidate)) {
            $candidate = '61ceef6bf69aef0a4f79b25384352d238979200f'
          }
          $mode = '${{ inputs.mode }}'
          $message = '${{ github.event.head_commit.message }}'
          if ($mode -eq 'health-bench' -or $message.Contains('[perf-health-bench]')) {
            ./eng/perf/run-healthchecks-evolution.ps1 -CandidateSha $candidate -Job Short
          }
          else {
            ./eng/perf/prepare-healthchecks-evolution.ps1 -CandidateSha $candidate -RunDry
          }

      - name: Upload HealthChecks smoke evidence
        if: ${{ always() && inputs.mode != 'health-bench' && !contains(github.event.head_commit.message, '[perf-health-bench]') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-healthchecks-evolution-smoke-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/health-checks/**/build-provenance.json
            artifacts/perf/health-checks/**/packages.lock.json
            artifacts/perf/health-checks/**/BenchmarkDotNet.Artifacts/**
            artifacts/perf/health-checks/dotnet-info.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload HealthChecks benchmark evidence
        if: ${{ always() && (inputs.mode == 'health-bench' || contains(github.event.head_commit.message, '[perf-health-bench]')) }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-healthchecks-evolution-bench-${{ github.sha }}
          path: |
            artifacts/perf/targets/**/target.json
            artifacts/perf/targets/**/diagnostics/**
            artifacts/perf/health-checks/**/build-provenance.json
            artifacts/perf/health-checks/**/packages.lock.json
            artifacts/perf/runs/health-checks/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9


  opentelemetry-evolution:
    name: OpenTelemetry evolution lab
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mode == 'otel-smoke' || inputs.mode == 'otel-bench')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[perf-otel-smoke]') || contains(github.event.head_commit.message, '[perf-otel-bench]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

