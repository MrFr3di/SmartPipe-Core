name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      recoverable-rerun:
        description: Allow already-published packages to be skipped when recovering a partial release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Require a release tag and resolve package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Run this workflow against the release tag." >&2
            exit 1
          fi
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$PACKAGE_VERSION" || "$PACKAGE_VERSION" == "$GITHUB_REF_NAME" ]]; then
            echo "Release tag must have the form v<package-version>." >&2
            exit 1
          fi
          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact-name=nuget-packages-$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  validation:
    needs: version
    uses: ./.github/workflows/reusable-release-validation.yml
    permissions:
      contents: read
    with:
      package-version: ${{ needs.version.outputs.package-version }}
      artifact-name: ${{ needs.version.outputs.artifact-name }}

  publish:
    needs: [version, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: nuget-production

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.version.outputs.artifact-name }}
          path: artifacts

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages in dependency order
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
          RECOVERABLE_RERUN: ${{ github.event_name == 'workflow_dispatch' && inputs.recoverable-rerun }}
        run: |
          skip_duplicate=()
          if [[ "$RECOVERABLE_RERUN" == "true" ]]; then
            skip_duplicate=(--skip-duplicate)
          fi
          manifest="artifacts/packages/manifest.json"
          mapfile -t packages < <(jq -r '.packages | sort_by(.publishOrder)[] | .nupkgPath' "$manifest")
          if (( ${#packages[@]} == 0 )); then
            echo "Package manifest contains no publishable packages." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            expected_hash="$(jq -r --arg path "$package" '.packages[] | select(.nupkgPath == $path) | .nupkgSha256' "$manifest")"
            actual_hash="$(sha256sum "$package" | awk '{print tolower($1)}')"
            if [[ -z "$expected_hash" || "$actual_hash" != "$expected_hash" ]]; then
              echo "Package hash does not match immutable manifest: $package" >&2
              exit 1
            fi
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json "${skip_duplicate[@]}"
          done

      - name: Verify published package versions are available
        shell: bash
        env:
          PACKAGE_MANIFEST: artifacts/packages/manifest.json
        run: |
          while IFS=$'\t' read -r package_id package_version; do
            package="${package_id,,}"
            version="${package_version,,}"
            url="https://api.nuget.org/v3-flatcontainer/${package}/${version}/${package}.${version}.nupkg"
            available=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --head "$url" >/dev/null; then
                available=true
                break
              fi
              echo "Waiting for $package_id $package_version to become available (attempt $attempt/12)."
              sleep 10
            done
            if [[ "$available" != true ]]; then
              echo "$package_id $package_version is not available from NuGet after publication." >&2
              exit 1
            fi
          done < <(jq -r '.packages | sort_by(.publishOrder)[] | [.id, .version] | @tsv' "$PACKAGE_MANIFEST")
