name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, pack and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version from tag
        id: version
        shell: bash
        run: |
          CORE_VERSION="$(dotnet msbuild src/SmartPipe.Core/SmartPipe.Core.csproj -getProperty:Version -nologo)"
          EXT_VERSION="$(dotnet msbuild src/SmartPipe.Extensions/SmartPipe.Extensions.csproj -getProperty:Version -nologo)"
          VERSION_OUTPUT="$(bash eng/validate-release-version.sh "${GITHUB_REF_NAME}" "$CORE_VERSION" "$EXT_VERSION")"
          echo "$VERSION_OUTPUT"
          PACKAGE_VERSION="$(echo "$VERSION_OUTPUT" | awk -F= '/^PACKAGE_VERSION=/{print $2}')"
          BASE_VERSION="$(echo "$VERSION_OUTPUT" | awk -F= '/^BASE_VERSION=/{print $2}')"

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing SmartPipe packages version: $PACKAGE_VERSION"

      - name: Restore
        run: dotnet restore SmartPipe.Core.slnx --locked-mode

      - name: Verify tag matches project versions
        shell: bash
        run: |
          CORE_VERSION="$(dotnet msbuild src/SmartPipe.Core/SmartPipe.Core.csproj -getProperty:Version -nologo)"
          EXT_VERSION="$(dotnet msbuild src/SmartPipe.Extensions/SmartPipe.Extensions.csproj -getProperty:Version -nologo)"
          bash eng/validate-release-version.sh "${GITHUB_REF_NAME}" "$CORE_VERSION" "$EXT_VERSION"

      - name: Build Release
        run: |
          dotnet build SmartPipe.Core.slnx \
            --configuration Release \
            --no-restore \
            -warnaserror \
            /p:ContinuousIntegrationBuild=true

      - name: Test Core
        run: |
          dotnet test --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal

      - name: Test Extensions
        run: |
          dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal

      - name: Pack
        run: |
          rm -rf artifacts/packages
          mkdir -p artifacts/packages

          dotnet pack src/SmartPipe.Core/SmartPipe.Core.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/packages \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:ContinuousIntegrationBuild=true

          dotnet pack src/SmartPipe.Extensions/SmartPipe.Extensions.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/packages \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:ContinuousIntegrationBuild=true

      - name: List packages
        run: ls -la artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/packages

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
