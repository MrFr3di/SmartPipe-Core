name: Regenerate .NET 10.0.12 lock files

on:
  push:
    branches:
      - release/2.2.0-dotnet-10.0.12

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: release/2.2.0-dotnet-10.0.12
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Regenerate solution lock files
        run: dotnet restore SmartPipe.Core.slnx --force-evaluate

      - name: Regenerate consumer scenario lock files
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            tests/Consumers/Scenarios/csv-di-composition/Consumer.csproj \
            tests/Consumers/Scenarios/csv-direct/Consumer.csproj \
            tests/Consumers/Scenarios/csv-facade-source/Consumer.csproj \
            tests/Consumers/Scenarios/csv-trim-diagnostic/Consumer.csproj
          do
            dotnet restore "$project" --force-evaluate
          done

      - name: Commit regenerated lock files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files '*packages.lock.json' -z | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "Expected servicing refresh to modify lock files." >&2
            exit 1
          fi
          git commit -m "build(release): regenerate .NET 10.0.12 lock files"
          git push origin HEAD:release/2.2.0-dotnet-10.0.12
