name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, upd ]
  pull_request:
    branches: [ main, upd ]

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore
      run: dotnet restore SmartPipe.Core.slnx

    - name: Verify NuGet lock files
      run: dotnet restore SmartPipe.Core.slnx --locked-mode

    - name: Format verify
      run: dotnet format SmartPipe.Core.slnx --verify-no-changes --no-restore
    
    - name: Build
      run: dotnet build SmartPipe.Core.slnx --no-restore -c Release -warnaserror
    
    - name: Core tests with coverage
      run: dotnet run --project tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-build -c Release -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    - name: Extensions tests
      run: dotnet test --project tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-build --verbosity normal -c Release

    - name: Test and benchmark warning gate
      run: |
        dotnet build tests/SmartPipe.Core.Tests/SmartPipe.Core.Tests.csproj --no-restore -c Release -warnaserror
        dotnet build tests/SmartPipe.Extensions.Tests/SmartPipe.Extensions.Tests.csproj --no-restore -c Release -warnaserror
        dotnet build benchmarks/SmartPipe.Benchmarks/SmartPipe.Benchmarks.csproj --no-restore -c Release -warnaserror

    - name: Pack Core
      run: dotnet pack src/SmartPipe.Core/SmartPipe.Core.csproj --no-build -c Release -p:EnablePackageValidation=true -o artifacts/packages

    - name: Pack Extensions
      run: dotnet pack src/SmartPipe.Extensions/SmartPipe.Extensions.csproj --no-build -c Release -p:EnablePackageValidation=true -o artifacts/packages

    - name: Set package version
      run: |
        PACKAGE_VERSION=$(dotnet msbuild src/SmartPipe.Core/SmartPipe.Core.csproj -getProperty:Version)
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

    - name: Consumer smoke
      run: |
        dotnet new console -n SmartPipe.ConsumerSmoke -o artifacts/consumer-smoke
        cat > artifacts/consumer-smoke/NuGet.Config <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="smartpipe-local" value="../packages" />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="smartpipe-local">
              <package pattern="SmartPipe.*" />
            </packageSource>
            <packageSource key="nuget">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        XML
        pushd artifacts/consumer-smoke
        dotnet add SmartPipe.ConsumerSmoke.csproj package SmartPipe.Core --version "$PACKAGE_VERSION"
        dotnet add SmartPipe.ConsumerSmoke.csproj package SmartPipe.Extensions --version "$PACKAGE_VERSION"
        popd
        cat > artifacts/consumer-smoke/Program.cs <<'CS'
        using System.Runtime.CompilerServices;
        using Microsoft.Extensions.DependencyInjection;
        using SmartPipe.Core;
        using SmartPipe.Extensions;
        using SmartPipe.Extensions.Transforms;

        await ConsumerSmoke.RunAsync();

        internal static class ConsumerSmoke
        {
            public static async Task RunAsync()
            {
                await VerifyTypedSourceTransformSinkAsync();
                await VerifyOutputConsumerAsync();
                await VerifyDrainAsync();
                await VerifyDiFactoryAsync();
                await VerifyExtensionsReferenceAsync();
                Console.WriteLine("SmartPipe consumer smoke passed.");
            }

            private static async Task VerifyTypedSourceTransformSinkAsync()
            {
                var sink = new CollectingSink<string>();
                var run = PipelineBuilder
                    .From(new ArraySource<int>(1, 2, 3))
                    .WithPipelineId("consumer-smoke")
                    .Transform(PipelineTransformer.FromFunc<int, string>(
                        static (value, ct) => ValueTask.FromResult($"typed:{value}")))
                    .To(sink);
                await run.Completion;
                RequireSequence(sink.Values, ["typed:1", "typed:2", "typed:3"], "typed sink");
                if (run.Metrics.ItemsProcessed != 3)
                    throw new InvalidOperationException("Metrics did not count typed pipeline items.");
            }

            private static async Task VerifyOutputConsumerAsync()
            {
                var run = PipelineBuilder
                    .From(new ArraySource<int>(4, 5))
                    .Transform(PipelineTransformer.FromFunc<int, int>(
                        static (value, ct) => ValueTask.FromResult(value * 2)))
                    .Run();
                var values = new List<int>();
                await foreach (var result in run.ReadResultsAsync())
                {
                    if (!result.IsSuccess)
                        throw new InvalidOperationException("Output consumer observed a failed result.");
                    values.Add(result.Value);
                }
                await run.Completion;
                RequireSequence(values, [8, 10], "typed output consumer");
            }

            private static async Task VerifyDrainAsync()
            {
                var run = PipelineBuilder
                    .From(new ArraySource<int>(7))
                    .Transform(PipelineTransformer.FromFunc<int, int>(
                        static (value, ct) => ValueTask.FromResult(value)))
                    .Run();
                await run.DrainAsync(TimeSpan.FromSeconds(5));
                await run.Completion;
                if (run.State != PipelineRunState.Completed)
                    throw new InvalidOperationException($"DrainAsync left run in state {run.State}.");
            }

            private static async Task VerifyDiFactoryAsync()
            {
                var services = new ServiceCollection();
                services.AddSingleton<DiRecorder>();
                services.AddScoped<DiSource>();
                services.AddScoped<DiStage>();
                services.AddScoped<DiSink>();
                services.AddSmartPipe<int, string>(
                    "consumer-di",
                    builder => builder
                        .UseSource<DiSource>()
                        .UseStage<DiStage>()
                        .UseSink<DiSink>());
                using var provider = services.BuildServiceProvider(
                    new ServiceProviderOptions { ValidateScopes = true, ValidateOnBuild = true });
                var factory = provider.GetRequiredService<ISmartPipeFactory<int, string>>();
                await factory.Start().Completion;
                var recorder = provider.GetRequiredService<DiRecorder>();
                RequireSequence(recorder.Values, ["di:9"], "typed DI factory");
                var monitor = provider.GetRequiredService<ISmartPipeRunHealthMonitor<int, string>>();
                if (monitor.CaptureSnapshot().State != PipelineRunState.Completed)
                    throw new InvalidOperationException("Typed health monitor did not observe DI run completion.");
            }

            private static async Task VerifyExtensionsReferenceAsync()
            {
                var filter = new FilterTransform<int>(value => value > 3);
                await filter.InitializeAsync();
                var accepted = await filter.TransformAsync(ProcessingEnvelope<int>.Create(5));
                var rejected = await filter.TransformAsync(ProcessingEnvelope<int>.Create(2));
                await filter.DisposeAsync();
                if (!accepted.IsSuccess || accepted.Value != 5)
                    throw new InvalidOperationException("FilterTransform did not accept the expected payload.");
                if (rejected.IsSuccess)
                    throw new InvalidOperationException("FilterTransform did not reject the expected payload.");
            }

            private static void RequireSequence<T>(IReadOnlyList<T> actual, IReadOnlyList<T> expected, string scenario)
            {
                if (actual.Count != expected.Count)
                    throw new InvalidOperationException($"{scenario} returned {actual.Count} items, expected {expected.Count}.");
                for (var i = 0; i < expected.Count; i++)
                {
                    if (!EqualityComparer<T>.Default.Equals(actual[i], expected[i]))
                        throw new InvalidOperationException($"{scenario} item {i} was {actual[i]}, expected {expected[i]}.");
                }
            }
        }

        internal sealed class ArraySource<T>(params T[] values) : IPipelineSource<T>
        {
            public ValueTask InitializeAsync(CancellationToken ct = default) => ValueTask.CompletedTask;
            public async IAsyncEnumerable<ProcessingEnvelope<T>> ReadEnvelopesAsync([EnumeratorCancellation] CancellationToken ct = default)
            {
                foreach (var value in values)
                {
                    ct.ThrowIfCancellationRequested();
                    yield return ProcessingEnvelope<T>.Create(value);
                    await Task.Yield();
                }
            }
            public ValueTask DisposeAsync() => ValueTask.CompletedTask;
        }

        internal sealed class CollectingSink<T> : IPipelineSink<T>
        {
            public List<T> Values { get; } = [];
            public ValueTask InitializeAsync(CancellationToken ct = default) => ValueTask.CompletedTask;
            public ValueTask WriteAsync(ProcessingEnvelope<T> envelope, CancellationToken ct = default)
            {
                Values.Add(envelope.Payload);
                return ValueTask.CompletedTask;
            }
            public ValueTask DisposeAsync() => ValueTask.CompletedTask;
        }

        internal sealed class DiRecorder
        {
            public List<string> Values { get; } = [];
        }

        internal sealed class DiSource : IPipelineSource<int>
        {
            public ValueTask InitializeAsync(CancellationToken ct = default) => ValueTask.CompletedTask;
            public async IAsyncEnumerable<ProcessingEnvelope<int>> ReadEnvelopesAsync([EnumeratorCancellation] CancellationToken ct = default)
            {
                await Task.Yield();
                yield return ProcessingEnvelope<int>.Create(9);
            }
            public ValueTask DisposeAsync() => ValueTask.CompletedTask;
        }

        internal sealed class DiStage : IPipelineTransformer<int, string>
        {
            public ValueTask InitializeAsync(CancellationToken ct = default) => ValueTask.CompletedTask;
            public ValueTask<StageResult<string>> TransformAsync(ProcessingEnvelope<int> envelope, CancellationToken ct = default)
                => ValueTask.FromResult(StageResult<string>.Success($"di:{envelope.Payload}"));
            public ValueTask DisposeAsync() => ValueTask.CompletedTask;
        }

        internal sealed class DiSink(DiRecorder recorder) : IPipelineSink<string>
        {
            public ValueTask InitializeAsync(CancellationToken ct = default) => ValueTask.CompletedTask;
            public ValueTask WriteAsync(ProcessingEnvelope<string> envelope, CancellationToken ct = default)
            {
                recorder.Values.Add(envelope.Payload);
                return ValueTask.CompletedTask;
            }
            public ValueTask DisposeAsync() => ValueTask.CompletedTask;
        }
        CS
        dotnet run --project artifacts/consumer-smoke/SmartPipe.ConsumerSmoke.csproj -c Release

    - name: Trimmed consumer smoke
      run: |
        dotnet publish artifacts/consumer-smoke/SmartPipe.ConsumerSmoke.csproj -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=true -o artifacts/consumer-smoke-trim
        ./artifacts/consumer-smoke-trim/SmartPipe.ConsumerSmoke

    - name: NativeAOT consumer smoke
      run: |
        dotnet publish artifacts/consumer-smoke/SmartPipe.ConsumerSmoke.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/consumer-smoke-aot
        ./artifacts/consumer-smoke-aot/SmartPipe.ConsumerSmoke

    - name: JSON and dead-letter AOT smoke
      run: |
        dotnet new console -n SmartPipe.JsonDeadLetterAotSmoke -o artifacts/json-deadletter-aot-smoke --no-restore
        rm -f artifacts/json-deadletter-aot-smoke/packages.lock.json
        cat > artifacts/json-deadletter-aot-smoke/NuGet.Config <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="smartpipe-local" value="../packages" />
            <add key="nuget" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="smartpipe-local">
              <package pattern="SmartPipe.*" />
            </packageSource>
            <packageSource key="nuget">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        XML
        cat > artifacts/json-deadletter-aot-smoke/SmartPipe.JsonDeadLetterAotSmoke.csproj <<XML
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <TargetFramework>net10.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
            <RestorePackagesWithLockFile>false</RestorePackagesWithLockFile>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="SmartPipe.Core" Version="$PACKAGE_VERSION" />
            <PackageReference Include="SmartPipe.Extensions" Version="$PACKAGE_VERSION" />
          </ItemGroup>
        </Project>
        XML
        cat > artifacts/json-deadletter-aot-smoke/Program.cs <<'CS'
        using System.Text;
        using System.Text.Json;
        using System.Text.Json.Serialization;
        using SmartPipe.Core;
        using SmartPipe.Extensions.Selectors;
        using SmartPipe.Extensions.Sinks;
        using SmartPipe.Extensions.Transforms;

        await AotSmoke.RunAsync();

        internal static class AotSmoke
        {
            public static async Task RunAsync()
            {
                var workDir = Path.Combine(Path.GetTempPath(), "smartpipe-update12-" + Guid.NewGuid().ToString("N"));
                Directory.CreateDirectory(workDir);
                try
                {
                    await VerifyJsonTransformAsync();
                    await VerifyJsonFileSinkAndArraySourceAsync(workDir);
                    await VerifyJsonFileSourceNdjsonAsync(workDir);
                    await VerifyModernDeadLetterSerializerAsync();
                    await VerifyTypedDeadLetterSinkAsync();
                    await VerifyTypedDeadLetterSourceAsync(workDir);
                    Console.WriteLine("SmartPipe JSON/dead-letter AOT smoke passed.");
                }
                finally
                {
                    try { Directory.Delete(workDir, recursive: true); } catch { }
                }
            }

            private static async Task VerifyJsonTransformAsync()
            {
                var transform = new JsonTransform<AotPayload, AotPayload>(
                    AotSmokeJsonContext.Default.AotPayload,
                    AotSmokeJsonContext.Default.AotPayload);
                await transform.InitializeAsync();
                var result = await transform.TransformAsync(ProcessingEnvelope<AotPayload>.Create(new AotPayload(1, "transform")));
                await transform.DisposeAsync();
                Require(result.IsSuccess && result.Value == new AotPayload(1, "transform"), "JsonTransform source-generated path failed.");
            }

            private static async Task VerifyJsonFileSinkAndArraySourceAsync(string workDir)
            {
                var path = Path.Combine(workDir, "payloads.json");
                var sink = new JsonFileSink<AotPayload>(path, AotSmokeJsonContext.Default.ListAotPayload, flushInterval: 2);
                await sink.InitializeAsync();
                await sink.WriteAsync(ProcessingEnvelope<AotPayload>.Create(new AotPayload(2, "sink-a")));
                await sink.WriteAsync(ProcessingEnvelope<AotPayload>.Create(new AotPayload(3, "sink-b")));
                await sink.DisposeAsync();

                var source = new JsonFileSource<AotPayload>(path, AotSmokeJsonContext.Default.ListAotPayload, AotSmokeJsonContext.Default.AotPayload);
                await source.InitializeAsync();
                var values = await ReadTypedSourceAsync(source);
                await source.DisposeAsync();
                RequireSequence(values, [new AotPayload(2, "sink-a"), new AotPayload(3, "sink-b")], "JsonFileSink/JsonFileSource array path");
            }

            private static async Task VerifyJsonFileSourceNdjsonAsync(string workDir)
            {
                var path = Path.Combine(workDir, "payloads.ndjson");
                await File.WriteAllLinesAsync(path,
                [
                    JsonSerializer.Serialize(new AotPayload(4, "ndjson-a"), AotSmokeJsonContext.Default.AotPayload),
                    JsonSerializer.Serialize(new AotPayload(5, "ndjson-b"), AotSmokeJsonContext.Default.AotPayload),
                ]);
                var source = new JsonFileSource<AotPayload>(path, AotSmokeJsonContext.Default.ListAotPayload, AotSmokeJsonContext.Default.AotPayload);
                await source.InitializeAsync();
                var values = await ReadTypedSourceAsync(source);
                await source.DisposeAsync();
                RequireSequence(values, [new AotPayload(4, "ndjson-a"), new AotPayload(5, "ndjson-b")], "JsonFileSource NDJSON path");
            }

            private static async Task VerifyModernDeadLetterSerializerAsync()
            {
                var serializer = new JsonLinesDeadLetterSerializer<AotPayload>(AotSmokeJsonContext.Default.DeadLetterEnvelopeAotPayload);
                await using var stream = new MemoryStream();
                var envelope = new DeadLetterEnvelope<AotPayload>
                {
                    SchemaVersion = 1,
                    PipelineId = "pipeline-aot",
                    RunId = "run-aot",
                    TraceId = 42,
                    StageId = "stage-json",
                    StageName = "Json stage",
                    OriginalPayload = new AotPayload(6, "dead-letter"),
                    Metadata = MetadataBag.Empty.Set("source", "update12"),
                    Error = new SmartPipeError("boom", ErrorType.Permanent, "AotSmoke"),
                    Attempt = 2,
                    FailedAtUtc = DateTimeOffset.UnixEpoch,
                };
                await serializer.WriteAsync(envelope, stream);
                stream.Position = 0;
                var roundTripped = new List<DeadLetterEnvelope<AotPayload>>();
                await foreach (var item in serializer.ReadAsync(stream))
                    roundTripped.Add(item);
                Require(roundTripped.Count == 1 && roundTripped[0].OriginalPayload == envelope.OriginalPayload, "Modern dead-letter serializer failed.");
            }

            private static async Task VerifyTypedDeadLetterSinkAsync()
            {
                await using var stream = new MemoryStream();
                var sink = new DeadLetterSink<AotPayload>(
                    "typed-dead-letter.json",
                    AotSmokeJsonContext.Default.DeadLetterEnvelopeAotPayload,
                    logger: null,
                    stream: stream);
                await sink.InitializeAsync();
                await sink.WriteAsync(ProcessingEnvelope<DeadLetterEnvelope<AotPayload>>.Create(new DeadLetterEnvelope<AotPayload>
                {
                    SchemaVersion = 1,
                    PipelineId = "pipeline-aot",
                    RunId = "run-aot",
                    TraceId = 60,
                    StageId = "stage-dead-letter",
                    StageName = "Dead letter stage",
                    OriginalPayload = new AotPayload(6, "dead-letter-sink"),
                    Metadata = MetadataBag.Empty,
                    Error = new SmartPipeError("typed failure", ErrorType.Permanent, "AotSmoke"),
                    Attempt = 1,
                    FailedAtUtc = DateTimeOffset.UnixEpoch,
                }));
                await sink.DisposeAsync();
                Require(Encoding.UTF8.GetString(stream.ToArray()).Contains("typed failure", StringComparison.Ordinal), "Typed DeadLetterSink source-generated path failed.");
            }

            private static async Task VerifyTypedDeadLetterSourceAsync(string workDir)
            {
                var path = Path.Combine(workDir, "typed-dead-letter-source.json");
                var deadLetter = new DeadLetterEnvelope<AotPayload>
                {
                    SchemaVersion = 1,
                    PipelineId = "pipeline-aot",
                    RunId = "run-aot",
                    TraceId = 70,
                    StageId = "stage-source",
                    StageName = "Source stage",
                    OriginalPayload = new AotPayload(7, "typed-source"),
                    Metadata = MetadataBag.Empty,
                    Error = new SmartPipeError("source failure", ErrorType.Permanent, "AotSmoke"),
                    Attempt = 1,
                    FailedAtUtc = DateTimeOffset.UnixEpoch,
                };
                await File.WriteAllTextAsync(
                    path,
                    JsonSerializer.Serialize(deadLetter, AotSmokeJsonContext.Default.DeadLetterEnvelopeAotPayload));
                var source = new DeadLetterSource<AotPayload>(path, AotSmokeJsonContext.Default.AotPayload);
                await source.InitializeAsync();
                var values = await ReadTypedSourceAsync(source);
                await source.DisposeAsync();
                RequireSequence(values, [new AotPayload(7, "typed-source")], "Typed DeadLetterSource source-generated path");
            }

            private static async Task<List<T>> ReadTypedSourceAsync<T>(IPipelineSource<T> source, CancellationToken ct = default)
            {
                var values = new List<T>();
                await foreach (var envelope in source.ReadEnvelopesAsync(ct).WithCancellation(ct))
                    values.Add(envelope.Payload);
                return values;
            }

            private static void Require(bool condition, string message)
            {
                if (!condition)
                    throw new InvalidOperationException(message);
            }

            private static void RequireSequence<T>(IReadOnlyList<T> actual, IReadOnlyList<T> expected, string scenario)
            {
                Require(actual.Count == expected.Count, $"{scenario} returned {actual.Count} items, expected {expected.Count}.");
                for (var i = 0; i < expected.Count; i++)
                {
                    if (!EqualityComparer<T>.Default.Equals(actual[i], expected[i]))
                        throw new InvalidOperationException($"{scenario} item {i} was {actual[i]}, expected {expected[i]}.");
                }
            }
        }

        internal sealed record AotPayload(int Id, string Name);

        [JsonSerializable(typeof(AotPayload))]
        [JsonSerializable(typeof(List<AotPayload>))]
        [JsonSerializable(typeof(DeadLetterEnvelope<AotPayload>))]
        [JsonSerializable(typeof(SmartPipeError))]
        [JsonSerializable(typeof(MetadataBag))]
        internal sealed partial class AotSmokeJsonContext : JsonSerializerContext;
        CS
        dotnet run --project artifacts/json-deadletter-aot-smoke/SmartPipe.JsonDeadLetterAotSmoke.csproj -c Release
        dotnet publish artifacts/json-deadletter-aot-smoke/SmartPipe.JsonDeadLetterAotSmoke.csproj -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=true -o artifacts/json-deadletter-aot-smoke-trim
        ./artifacts/json-deadletter-aot-smoke-trim/SmartPipe.JsonDeadLetterAotSmoke
        dotnet publish artifacts/json-deadletter-aot-smoke/SmartPipe.JsonDeadLetterAotSmoke.csproj -c Release -r linux-x64 --self-contained true -p:PublishAot=true -o artifacts/json-deadletter-aot-smoke-aot
        ./artifacts/json-deadletter-aot-smoke-aot/SmartPipe.JsonDeadLetterAotSmoke

    - name: Vulnerable package scan
      run: dotnet list SmartPipe.Core.slnx package --vulnerable --include-transitive

    - name: Deprecated package scan
      run: dotnet list SmartPipe.Core.slnx package --deprecated --include-transitive

    - name: Outdated package report
      continue-on-error: true
      run: dotnet list SmartPipe.Core.slnx package --outdated

    - name: Docs link check
      uses: lycheeverse/lychee-action@v2
      with:
        args: --no-progress README.md 'docs/**/*.md'

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/packages
