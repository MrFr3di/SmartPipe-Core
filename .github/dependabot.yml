version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Keep OpenTelemetry components compatible and avoid separate PRs for each SDK artifact.
      # Security updates remain independently reviewed and are not delayed by this group.
      observability-and-coverage:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "OpenTelemetry"
          - "OpenTelemetry.*"
          - "Microsoft.Testing.Extensions.CodeCoverage"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      codeql-version:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
